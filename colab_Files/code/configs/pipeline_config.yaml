# ─────────────────────────────────────────────────────────────────────────
# IPC2BNS-Verify Pipeline Configuration
# ─────────────────────────────────────────────────────────────────────────
# This is the single config file that controls all pipeline behavior.
# Swap models/stages here, not in code.

project:
  name: "IPC2BNS-Verify"
  version: "0.1.0"
  root: "/content/drive/MyDrive/NLP_rspaper"

paths:
  raw_data: "${project.root}/data/00_raw"
  cleaned_data: "${project.root}/data/01_cleaned"
  ground_truth: "${project.root}/data/02_ground_truth"
  benchmark: "${project.root}/data/03_benchmark"
  refresh_sim: "${project.root}/data/04_refresh_sim"
  embeddings: "${project.root}/data/05_embeddings_index"
  results: "${project.root}/results"
  code: "${project.root}/code"
  configs: "${project.root}/code/configs"
  checkpoints: "${project.root}/checkpoints"

# ── Data Sources ──────────────────────────────────────────────────────
data_sources:
  india_code:
    base_url: "https://www.indiacode.nic.in"
    acts:
      ipc:
        name: "Indian Penal Code, 1860"
        act_id: "1860_45"
        sections_range: [1, 511]
        effective_until: "2024-06-30"
      bns:
        name: "Bharatiya Nyaya Sanhita, 2023"
        act_id: "2023_45"
        sections_range: [1, 358]
        effective_from: "2024-07-01"

  concordance_sources:
    - name: "Kerala Prisons / CAPT Bhopal Concordance Table"
      type: "pdf"
      filename: "concordance_source_A.pdf"
    - name: "IEEE DataPort BNS Dataset"
      type: "csv"
      filename: "bns_ieee_dataport.csv"

# ── Concordance Table Schema ─────────────────────────────────────────
concordance:
  version: "v1"
  relationship_types:
    - "exact"           # Same content, just renumbered
    - "renumbered"      # Renumbered with minor wording changes
    - "split"           # One IPC section → multiple BNS sections
    - "merged"          # Multiple IPC sections → one BNS section
    - "repealed"        # IPC section has no BNS counterpart
    - "new_in_bns"      # BNS section with no IPC counterpart
    - "modified"        # Content substantively changed

# ── Models ────────────────────────────────────────────────────────────
models:
  query_normalizer:
    provider: "google"            # google | openai | local
    model_name: "gemini-2.0-flash"
    temperature: 0.0
    max_tokens: 256
    purpose: "Extract section number or offence keyword from free text"

  generator:
    provider: "google"
    model_name: "gemini-2.5-flash"
    temperature: 0.1
    max_tokens: 1024
    purpose: "Generate answers from retrieved chunks with citations"

  embedding:
    primary:
      provider: "google"
      model_name: "text-embedding-004"
      dimensions: 768
    baseline:
      provider: "huggingface"
      model_name: "BAAI/bge-large-en-v1.5"
      dimensions: 1024

  judge:
    provider: "google"
    model_name: "gemini-2.5-flash"
    temperature: 0.0
    max_tokens: 512
    purpose: "LLM-as-judge for answer correctness scoring"

# ── Retrieval ─────────────────────────────────────────────────────────
retrieval:
  vector_db: "faiss"              # faiss | chroma
  top_k: 5
  chunk_strategy: "section_level" # section_level | paragraph | fixed_token
  metadata_fields:
    - "act"
    - "section_number"
    - "chapter"
    - "effective_date_range"

# ── Verifier ──────────────────────────────────────────────────────────
verifier:
  layer1:
    enabled: true
    method: "set_membership"      # Pure string/set matching
    on_fail: "reject"             # reject | flag_unverified
  layer2:
    enabled: true
    method: "entity_grounding"    # Entity extraction + overlap scoring
    entity_extractor: "spacy"     # spacy | llm
    min_overlap_score: 0.5

# ── Evaluation ────────────────────────────────────────────────────────
evaluation:
  stages:
    - id: 1
      name: "Baseline LLM (no retrieval)"
      retrieval: false
      verifier: false
      refresh: false
    - id: 2
      name: "+RAG (retrieval, no verifier)"
      retrieval: true
      verifier: false
      refresh: false
    - id: 3
      name: "+Hard-constraint verifier"
      retrieval: true
      verifier: true
      refresh: false
    - id: 4
      name: "+Verifier + simulated corpus refresh"
      retrieval: true
      verifier: true
      refresh: true

  metrics:
    - "citation_existence_accuracy"
    - "answer_correctness"
    - "retrieval_precision_at_k"
    - "retrieval_recall_at_k"
    - "hallucination_catch_rate"
    - "false_positive_rate"
    - "refresh_delta"

  human_calibration:
    sample_fraction: 0.15         # Review 15% of test set
    rubric:
      - "correct"
      - "partially_correct"
      - "incorrect"
      - "hallucinated"

# ── Refresh Simulation ───────────────────────────────────────────────
refresh:
  num_amendment_cases: 25         # 20-30 per the technical doc
  focus_on:
    - "split"
    - "merged"
    - "repealed"
    - "modified"

# ── Reproducibility ──────────────────────────────────────────────────
reproducibility:
  random_seed: 42
  log_all_prompts: true
  log_all_responses: true
  results_format: "json"
